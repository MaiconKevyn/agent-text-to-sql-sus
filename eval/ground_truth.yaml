- id: gt_gt134
  question: Qual a média de dias de internação por especialidade médica, comparando lado a lado os estados
    MA e RS?
  category: join_dimensao
  difficulty: dificil
  tests: 'HARD: 3-table JOIN + CASE WHEN pivot (AVG per state in separate columns) + HAVING dual presence
    condition. No hidden support threshold is applied because the question asks only for side-by-side
    averages. Result: 13 specialties. CLINICOS: MA 4.50 days vs RS 7.06 days; CIRURGICO: MA 4.16 vs RS
    4.22; OBSTETRICOS: MA 2.18 vs RS 2.65.'
  gold_sql: SELECT e."DESCRICAO" AS especialidade, ROUND(AVG(CASE WHEN mu."SG_UF" = 'MA' THEN i."DIAS_PERM"
    END), 2) AS media_dias_MA, ROUND(AVG(CASE WHEN mu."SG_UF" = 'RS' THEN i."DIAS_PERM" END), 2) AS media_dias_RS
    FROM internacoes i JOIN especialidade e ON i."ESPEC" = e."ESPEC" JOIN municipios mu ON i."MUNIC_RES"
