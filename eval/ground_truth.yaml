  question: Quais diagnosticos tiveram maior crescimento percentual de internacoes do periodo 2015-2019
    para 2020-2023? Liste os 10 primeiros.
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'DT_INTER -> DT_SAIDA (convenção da base). | Gold corrigido: removido LIMIT que a pergunta não
    pede; JOIN cid -> LEFT JOIN (cid tem códigos órfãos no fato)'
  gold_sql: 'WITH p1 AS (SELECT "DIAG_PRINC" AS cid, COUNT(*) AS total_2015_2019 FROM internacoes WHERE
    year(DT_SAIDA) BETWEEN 2015 AND 2019 GROUP BY "DIAG_PRINC"), p2 AS (SELECT "DIAG_PRINC" AS cid, COUNT(*)
    AS total_2020_2023 FROM internacoes WHERE year(DT_SAIDA) BETWEEN 2020 AND 2023 GROUP BY "DIAG_PRINC")
    SELECT c."DESCRICAO" AS diagnostico, p1.total_2015_2019, p2.total_2020_2023, ROUND((p2.total_2020_2023
    - p1.total_2015_2019) * 100.0 / NULLIF(p1.total_2015_2019, 0), 2) AS crescimento_percentual FROM p1
    JOIN p2 ON p1.cid = p2.cid LEFT JOIN cid c ON p1.cid = c."CID" WHERE p1.total_2015_2019 >= 1000 ORDER
    BY crescimento_percentual DESC

    LIMIT 10;'
