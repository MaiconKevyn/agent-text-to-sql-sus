- id: gt_gt126
  question: Como se distribuem os hospitais em quartis de volume de internações? Mostre o número de hospitais
    e o intervalo de internações por quartil.
  category: agregacao_complexa
  difficulty: dificil
  tests: 'HARD: NTILE(4) window function over double-nested subquery. Result: 4 rows (quartiles). Q1 (lowest):
    178 hospitals, 1–3,372 admissions, avg 1,172; Q4 (highest): 177 hospitals, 26,785–584,036 admissions,
    avg 79,634.'
