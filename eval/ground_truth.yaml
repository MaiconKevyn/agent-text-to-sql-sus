    LIKE 'J%' AND "DT_INTER" IS NOT NULL) SELECT ano, periodo, COUNT(*) AS total_internacoes, SUM(CASE
    WHEN "MORTE" = true THEN 1 ELSE 0 END) AS total_mortes, ROUND(SUM(CASE WHEN "MORTE" = true THEN 1
