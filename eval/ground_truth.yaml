    HAVING COUNT(*) > 100 excludes low-volume municipalities. Top: São Bernardo do Campo ~9.82% | Gold
    corrigido: agrupamento por município passa a incluir a UF'
  gold_sql: SELECT mu."SG_UF" AS uf, mu."NO_MUNICIPIO" AS municipio, COUNT(*) AS total_internacoes, SUM(CASE
