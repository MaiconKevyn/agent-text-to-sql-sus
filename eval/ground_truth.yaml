    \ SEXO = 1) * 1.0\n             / NULLIF(COUNT(*) FILTER (WHERE SEXO IN (2, 3)), 0), 3) AS razao_h_m\n\
    FROM internacoes\nWHERE MARCA_UTI > 0 AND ESPEC = 1\nGROUP BY 1\nORDER BY 1;"
