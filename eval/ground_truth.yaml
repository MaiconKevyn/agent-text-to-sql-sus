- id: gt_gt208
  question: Quais diagnosticos apresentam maior diferenca de permanencia media entre criancas e adultos,
    considerando diagnosticos com pelo menos 1000 internacoes em cada grupo? Liste os 10 primeiros.
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'Tema: permanencia. Metrica: difference_avg_los. Denominador/escopo: diagnosticos com >=1000
    em cada grupo. Usa CTE e pivot condicional para comparar permanencia media criancas vs adultos. |
    Gold corrigido: removido LIMIT que a pergunta não pede; JOIN cid -> LEFT JOIN (cid tem códigos órfãos
    no fato)'
  gold_sql: 'WITH agg AS (SELECT c."DESCRICAO" AS diagnostico, CASE WHEN i."IDADE" < 18 THEN ''criancas''
    ELSE ''adultos'' END AS grupo_idade, COUNT(*) AS total_internacoes, AVG(i."DIAS_PERM") AS media_dias
    FROM internacoes i LEFT JOIN cid c ON i."DIAG_PRINC" = c."CID" WHERE i."IDADE" IS NOT NULL AND i."DIAS_PERM"
    IS NOT NULL GROUP BY c."DESCRICAO", grupo_idade), piv AS (SELECT diagnostico, MAX(CASE WHEN grupo_idade
    = ''criancas'' THEN total_internacoes END) AS n_criancas, MAX(CASE WHEN grupo_idade = ''adultos''
    THEN total_internacoes END) AS n_adultos, MAX(CASE WHEN grupo_idade = ''criancas'' THEN media_dias
    END) AS media_criancas, MAX(CASE WHEN grupo_idade = ''adultos'' THEN media_dias END) AS media_adultos
    FROM agg GROUP BY diagnostico) SELECT diagnostico, n_criancas, n_adultos, ROUND(media_criancas, 2)
    AS media_criancas, ROUND(media_adultos, 2) AS media_adultos, ROUND(ABS(media_adultos - media_criancas),
    2) AS diferenca_absoluta FROM piv WHERE n_criancas >= 1000 AND n_adultos >= 1000 ORDER BY diferenca_absoluta
    DESC

    LIMIT 10;'
  origem: GT208
