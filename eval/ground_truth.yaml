- id: gt_gt078
  question: Quais são os 10 principais motivos de internação para pacientes com menos de 18 anos, entre
    18 e 64 anos, e acima de 64 anos?
  category: agregacao_complexa
  difficulty: dificil
  tests: 'HARD: ROW_NUMBER() OVER (PARTITION BY faixa_etaria ORDER BY COUNT(*) DESC) rn<=10 → 30 rows
    total (10 per group). Groups: ''Menor de 18'' / ''18 a 64'' / ''65 ou mais''. Top-1 per group: <18=J189
    Pneumonia NE (155,932); 18-64=O800 Parto espontaneo cefalico (861,909); 65+=J189 Pneumonia NE (149,221).
    | Gold corrigido: JOIN cid -> LEFT JOIN (cid tem códigos órfãos no fato)'
  gold_sql: SELECT faixa_etaria, "DESCRICAO", total_internacoes FROM (SELECT CASE WHEN i."IDADE" < 18
    THEN 'Menor de 18' WHEN i."IDADE" BETWEEN 18 AND 64 THEN '18 a 64' ELSE '65 ou mais' END AS faixa_etaria,
    c."DESCRICAO", COUNT(*) AS total_internacoes, ROW_NUMBER() OVER (PARTITION BY CASE WHEN i."IDADE"
    < 18 THEN 'Menor de 18' WHEN i."IDADE" BETWEEN 18 AND 64 THEN '18 a 64' ELSE '65 ou mais' END ORDER
    BY COUNT(*) DESC) AS rn FROM internacoes i LEFT JOIN cid c ON i."DIAG_PRINC" = c."CID" GROUP BY faixa_etaria,
    c."DESCRICAO") subquery WHERE rn <= 10 ORDER BY faixa_etaria, rn;
  origem: GT078
