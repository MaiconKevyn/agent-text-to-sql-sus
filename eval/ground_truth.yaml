- id: gt_gt113
  question: Quais são os 10 municípios do RS com taxa de mortalidade acima da média estadual (considerando
    apenas municípios com mais de 500 internações)?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'HARD: two CTEs — one computes RS state-level average mortality (5.174%), second aggregates per
    municipality with HAVING > 500. Cross-join selects only municipalities above average. Output: 3 cols
    (nome, total_internacoes, taxa_mortalidade). Top: Santo Antônio das Missões 7.70%, Morro Redondo 7.43%,
    Rosário do Sul 7.41%.'
  gold_sql: "WITH media_rs AS (\n    SELECT ROUND(SUM(CASE WHEN i.\"MORTE\" = true THEN 1 ELSE 0 END)\
    \ * 100.0 / COUNT(*), 4) AS taxa_media\n    FROM internacoes i\n    JOIN municipios mu ON i.\"MUNIC_RES\"\
    \ = mu.\"CO_MUNICIPIO_6D\"\n    WHERE mu.\"SG_UF\" = 'RS'\n), por_municipio AS (\n    SELECT mu.\"\
    NO_MUNICIPIO\" AS nome,\n           COUNT(*) AS total_internacoes,\n           ROUND(SUM(CASE WHEN\
    \ i.\"MORTE\" = true THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS taxa_mortalidade\n    FROM internacoes\
    \ i\n    JOIN municipios mu ON i.\"MUNIC_RES\" = mu.\"CO_MUNICIPIO_6D\"\n    WHERE mu.\"SG_UF\" =\
    \ 'RS'\n    GROUP BY mu.\"NO_MUNICIPIO\"\n    HAVING COUNT(*) > 500\n)\nSELECT pm.nome, pm.total_internacoes,\
    \ pm.taxa_mortalidade\nFROM por_municipio pm, media_rs mr\nWHERE pm.taxa_mortalidade > mr.taxa_media\n\
    ORDER BY pm.taxa_mortalidade DESC\nLIMIT 10;"
  origem: GT113
