- id: gt_gt219
  question: Quais diagnosticos tiveram maior aumento na taxa de mortalidade entre 2008-2012 e 2019-2023?
    Liste os 10 primeiros.
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'DT_INTER -> DT_SAIDA (convenção da base). | Gold corrigido: removido LIMIT que a pergunta não
    pede; JOIN cid -> LEFT JOIN (cid tem códigos órfãos no fato)'
  gold_sql: 'WITH p1 AS (SELECT "DIAG_PRINC" AS cid, COUNT(*) AS n1, SUM(CASE WHEN "MORTE" = true THEN
    1 ELSE 0 END) AS m1 FROM internacoes WHERE year(DT_SAIDA) BETWEEN 2008 AND 2012 GROUP BY "DIAG_PRINC"),
    p2 AS (SELECT "DIAG_PRINC" AS cid, COUNT(*) AS n2, SUM(CASE WHEN "MORTE" = true THEN 1 ELSE 0 END)
    AS m2 FROM internacoes WHERE year(DT_SAIDA) BETWEEN 2019 AND 2023 GROUP BY "DIAG_PRINC") SELECT c."DESCRICAO"
    AS diagnostico, n1 AS internacoes_2008_2012, n2 AS internacoes_2019_2023, ROUND(m1 * 100.0 / NULLIF(n1,
    0), 2) AS taxa_2008_2012, ROUND(m2 * 100.0 / NULLIF(n2, 0), 2) AS taxa_2019_2023, ROUND((m2 * 100.0
    / NULLIF(n2, 0)) - (m1 * 100.0 / NULLIF(n1, 0)), 2) AS aumento_pontos_percentuais FROM p1 JOIN p2
    ON p1.cid = p2.cid LEFT JOIN cid c ON p1.cid = c."CID" WHERE n1 >= 1000 AND n2 >= 1000 ORDER BY aumento_pontos_percentuais
    DESC

    LIMIT 10;'
  origem: GT219
