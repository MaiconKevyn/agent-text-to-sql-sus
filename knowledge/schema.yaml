# =============================================================================
# Dicionário semântico do banco SIH-RD (DATASUS) — DuckDB
#
# Este arquivo é a ÚNICA fonte de verdade do contexto injetado no prompt do LLM.
# Todos os números e advertências abaixo foram medidos diretamente no banco
# (ver docs/PROFILING.md), não presumidos.
# =============================================================================

database:
  engine: DuckDB
  dialect_notes: |
    Dialeto DuckDB (compatível com PostgreSQL na maior parte). Disponíveis:
    year(d), month(d), date_diff('day', a, b), date_trunc('month', d),
    QUALIFY, FILTER (WHERE ...), try_cast, ILIKE.
  grain: |
    Uma linha = uma AIH (Autorização de Internação Hospitalar) do tipo RD
    (reduzida) já encerrada. Ou seja: uma internação faturada no SUS.
  row_count: 144386772
  period: |
    Período coberto por DT_SAIDA (data de alta/saída): 2007-08-01 a 2023-12-31.
    DT_INTER (data de entrada) pode ser bem anterior (mínimo 1995-03-03) porque
    internações longas iniciadas antes entram na base quando recebem alta.

# -----------------------------------------------------------------------------
# TABELA FATO
# -----------------------------------------------------------------------------
tables:
  internacoes:
    role: fato
    description: Internações hospitalares do SUS (AIH reduzida). 144.386.772 linhas.
    columns:
      N_AIH:      {type: VARCHAR, desc: "Número da AIH. Quase-único (599 números aparecem em >1 linha). NÃO use como chave primária confiável."}
      CNES:       {type: INTEGER, desc: "Código CNES do estabelecimento executante. 5.922 distintos. ATENÇÃO: a tabela `hospital` está VAZIA, então não há nome nem município do hospital."}
      DT_INTER:   {type: DATE, desc: "Data de internação (entrada)."}
      DT_SAIDA:   {type: DATE, desc: "Data de saída/alta. É a data que define o período da base — use-a para recortes temporais salvo pedido explícito do contrário."}
      DIAS_PERM:  {type: SMALLINT, desc: "Dias de permanência. 0 a 5.476, média 5,06. Sem valores negativos."}
      DIAR_ACOM:  {type: SMALLINT, desc: "Diárias de acompanhante."}
      PROC_REA:   {type: VARCHAR, desc: "Procedimento realizado (SIGTAP, 10 dígitos com zeros à esquerda). Junte com `procedimentos`."}
      CAR_INT:    {type: TINYINT, desc: "Caráter da internação (eletivo/urgência/acidente). Junte com `car_int`."}
      ESPEC:      {type: TINYINT, desc: "Especialidade do leito. Junte com `especialidade`."}
      COMPLEX:    {type: VARCHAR, desc: "Complexidade ('00','02','03'). Junte com `complexidade`."}
      MARCA_UTI:  {type: TINYINT, desc: "Tipo de UTI utilizada. 0 = não utilizou UTI. >0 = utilizou. Junte com `marca_uti`."}
      UTI_INT_TO: {type: TINYINT, desc: "INUTILIZÁVEL. Deveria ser o total de diárias de UTI, mas 9.107.168 das 9.107.197 internações com UTI têm valor 0 — só 29 linhas em toda a base são não-nulas. NUNCA use esta coluna; para intensidade de UTI use VAL_UTI."}
      IND_VDRL:   {type: BOOLEAN, desc: "Exame VDRL realizado. TRUE em 22.840.654 (15,8%)."}
      MORTE:      {type: BOOLEAN, desc: "Óbito durante a internação. TRUE = óbito. Total: 5.877.536 (4,07%)."}
      GESTRISCO:  {type: BOOLEAN, desc: "INUTILIZÁVEL. Nominalmente 'gestação de risco', mas está TRUE em 143.764.198 linhas (99,6%), incluindo 58,8 milhões de pacientes do sexo masculino. O campo está corrompido — NUNCA o use e avise o usuário se ele pedir gestação de risco."}
      DIAG_PRINC: {type: VARCHAR, desc: "CID-10 do diagnóstico principal, SEM PONTO (ex.: 'J189', 'A09'). Nunca nulo."}
      DIAG_SECUN: {type: VARCHAR, desc: "CID-10 do diagnóstico secundário. NUNCA É NULL: usa a string '0' para 'nenhum', em 137.854.822 linhas (95,5%). Para contar as que têm diagnóstico secundário use DIAG_SECUN <> '0' (6.531.950), NÃO `IS NOT NULL`."}
      CID_MORTE:  {type: VARCHAR, desc: "CID-10 da causa do óbito. Mesmo placeholder: '0' em 142.298.060 linhas (98,6%). Use CID_MORTE <> '0' (2.088.712)."}
      CID_NOTIF:  {type: VARCHAR, desc: "CID-10 de notificação compulsória. Placeholder '0' em 143.188.394 linhas (99,2%)."}
      DIAGSEC1..9: {type: VARCHAR, desc: "Nove colunas DIAGSEC1 … DIAGSEC9 com diagnósticos secundários adicionais. Estas SIM usam NULL (DIAGSEC1 tem 132.070.818 nulos)."}
      VAL_SH:     {type: DOUBLE, desc: "Valor de serviços hospitalares (R$)."}
      VAL_SP:     {type: DOUBLE, desc: "Valor de serviços profissionais (R$)."}
      VAL_UTI:    {type: DOUBLE, desc: "Valor de UTI (R$)."}
      VAL_TOT:    {type: DOUBLE, desc: "Valor total da AIH (R$). Média R$ 1.472,30; soma da base R$ 212,6 bilhões. Valores NOMINAIS, não deflacionados."}
      NASC:       {type: DATE, desc: "Data de nascimento do paciente."}
      IDADE:      {type: SMALLINT, desc: "Idade em ANOS COMPLETOS (0 a 130). Verificado: consistente com NASC/DT_INTER."}
      SEXO:       {type: TINYINT, desc: "Sexo. VEJA A REGRA CRÍTICA — no fato só existem os valores 1 e 3."}
      RACA_COR:   {type: VARCHAR, desc: "Raça/cor como string de 2 dígitos ('01'..'05','99'). Junte com `raca_cor`."}
      ETNIA:      {type: SMALLINT, desc: "Etnia indígena. QUASE VAZIA: 99,75% são 0 (não informado)."}
      NACIONAL:   {type: SMALLINT, desc: "Nacionalidade. 99,76% são 10 (Brasil) — sem variabilidade útil."}
      INSTRU:     {type: TINYINT, desc: "Grau de instrução. QUASE VAZIA: 99,17% são 0 (não informado). Use LEFT JOIN: o fato contém 5, 6 e 8, ausentes da dimensão."}
      VINCPREV:   {type: TINYINT, desc: "Vínculo previdenciário. QUASE VAZIA: 99,99% são 0 — só 17.533 linhas em 144 milhões têm valor."}
      CBOR:       {type: VARCHAR, desc: "Ocupação (CBO). QUASE VAZIA: '000000' em 144.369.239 linhas (99,99%). NUNCA É NULL, então `CBOR IS NOT NULL` casa tudo — use CBOR <> '000000'."}
      MUNIC_RES:  {type: INTEGER, desc: "Município de RESIDÊNCIA do paciente (código IBGE 6 dígitos). Junte com municipios.CO_MUNICIPIO_6D. NÃO é o município do hospital."}
      CEP:        {type: VARCHAR, desc: "CEP de residência."}
      NUM_FILHOS: {type: TINYINT, desc: "Número de filhos."}
      CONTRACEP1: {type: TINYINT, desc: "Método contraceptivo 1. Junte com `contraceptivos`."}
      CONTRACEP2: {type: TINYINT, desc: "Método contraceptivo 2."}
      INSC_PN:    {type: VARCHAR, desc: "Inscrição no pré-natal."}

# -----------------------------------------------------------------------------
# DIMENSÕES
# -----------------------------------------------------------------------------
  municipios:
    role: dimensao
    rows: 5590
    description: "Municípios brasileiros com UF, região de saúde e coordenadas."
    columns:
      CO_MUNICIPIO_6D: {type: INTEGER, desc: "Código IBGE 6 dígitos. CHAVE de junção com internacoes.MUNIC_RES."}
      CO_MUNICIPIO_7D: {type: INTEGER, desc: "Código IBGE 7 dígitos (com dígito verificador). NÃO use para juntar com o fato."}
      NO_MUNICIPIO:    {type: VARCHAR, desc: "Nome do município COM acento, em Title Case (ex.: 'São Paulo', 'Ribeirão Preto', 'Guajará-Mirim'). 2.387 dos 5.590 nomes têm acento. Para filtrar com segurança use strip_accents() dos DOIS lados."}
      SG_UF:           {type: VARCHAR, desc: "Sigla da UF. 27 siglas válidas aparecem no fato."}
      NO_REGIAO_SAUDE: {type: VARCHAR, desc: "Região de saúde. 19 municípios têm NULL."}
      latitude:        {type: FLOAT}
      longitude:       {type: FLOAT}
    caveat: "19 linhas são lixo (SG_UF numérica como '13','25' ou 'NA', com NO_MUNICIPIO corrompido). NENHUMA é alcançável pelo fato, então agregações por UF a partir de `internacoes` são seguras. Mas contagens feitas SOBRE a dimensão (ex.: 'quantos municípios existem') devem filtrar essas linhas."

  cid:
    role: dimensao
    rows: 14253
    description: "CID-10 com hierarquia capítulo > grupo > categoria."
    columns:
      CID:          {type: VARCHAR, desc: "Código CID-10 SEM PONTO. Categorias têm 3 caracteres ('A09'), subcategorias 4 ('A090')."}
      DESCRICAO:    {type: VARCHAR, desc: "Descrição abreviada, SEM acento (ex.: 'Colera dev Vibrio cholerae 01 biot cholerae')."}
      TP_NIVEL:     {type: VARCHAR, desc: "'CAT' (2.094 categorias) ou 'SUBCAT' (12.159 subcategorias)."}
      RESTRSEXO:    {type: VARCHAR}
      DS_CATEGORIA: {type: VARCHAR, desc: "Nome da categoria de 3 dígitos."}
      DS_GRUPO:     {type: VARCHAR, desc: "Grupo, prefixado pela faixa (ex.: 'A00-A09 Doenças infecciosas intestinais'). 226 grupos."}
      DS_CAPITULO:  {type: VARCHAR, desc: "Capítulo, prefixado por numeral romano (ex.: 'I. Algumas doenças infecciosas e parasitárias'). 22 capítulos."}
    caveat: "777 linhas do fato (0,001%) têm DIAG_PRINC sem correspondência aqui — sobretudo códigos U04, U09, U10 (COVID/emergência) e N182-N185. Prefira LEFT JOIN quando a contagem total importar."

  procedimentos:
    role: dimensao
    rows: 5394
    description: "Procedimentos SIGTAP."
    columns:
      PROC_REA:  {type: VARCHAR, desc: "Código de 10 dígitos com zeros à esquerda (ex.: '0310010039')."}
      NOME_PROC: {type: VARCHAR, desc: "Nome em MAIÚSCULAS, sem acento (ex.: 'PARTO NORMAL')."}
    caveat: "370 linhas do fato não casam. 1.928 procedimentos distintos aparecem no fato."

  tempo:
    role: dimensao
    rows: 5844
    description: "Dimensão de calendário."
    columns:
      data:       {type: DATE}
      ano:        {type: SMALLINT}
      mes:        {type: TINYINT}
      trimestre:  {type: TINYINT}
      dia_semana: {type: TINYINT}
    caveat: "COBRE APENAS 2008-01-01 a 2023-12-31. Um INNER JOIN entre DT_SAIDA e tempo.data DESCARTA SILENCIOSAMENTE as 431.437 internações de 2007. Prefira year(DT_SAIDA) / month(DT_SAIDA) diretamente."

  sexo:
    role: dimensao
    values: {0: "Ignorado", 1: "Masculino", 2: "Feminino", 3: "Feminino"}
    caveat: "DOIS códigos mapeiam para 'Feminino' (2 e 3), mas o FATO SÓ CONTÉM 1 e 3."

  raca_cor:
    role: dimensao
    values: {"00": "Não informado", "01": "Branca", "02": "Preta", "03": "Parda", "04": "Amarela", "05": "Indígena", "99": "Sem informação"}
    caveat: "No fato aparecem apenas '01'..'05' e '99'. O código de desconhecido usado é '99', não '00'. SUBNOTIFICAÇÃO ALTA: 42.177.427 internações (29,2%) estão como 'Sem informação' — a segunda categoria mais frequente, à frente de 'Branca'. Ao analisar por raça/cor, sempre mostre essa categoria e avise que quase um terço dos registros não tem a informação."

  car_int:
    role: dimensao
    values: {0: "Não informado", 1: "Eletivo", 2: "Urgência", 3: "Acidente no local trabalho ou a serv da empresa", 4: "Acidente no trajeto para o trabalho", 5: "Outros tipo de acidente de trânsito", 6: "Out tp lesões e envenen por agent quím físicos"}
    caveat: "No fato aparecem 1..6 (o 0 não ocorre)."

  complexidade:
    role: dimensao
    values: {"00": "Não informado", "01": "Atenção Básica", "02": "Média complexidade", "03": "Alta complexidade"}
    caveat: "No fato aparecem apenas '00', '02' e '03'."

  especialidade:
    role: dimensao
    values: {0: "Não informado", 1: "Cirúrgico", 2: "Obstétrico", 3: "Clínico", 4: "Crônicos", 5: "Psiquiatria", 6: "Pneumologia Sanitária", 7: "Pediátrico", 8: "Reabilitação", 9: "Leito Dia / Cirúrgico", 10: "Leito Dia / AIDS", 11: "Leito Dia / Fibrose Cística", 12: "Leito Dia / Intercorrência Pós-Transplante", 13: "Leito Dia / Geriatria", 14: "Leito Dia / Saúde Mental", 17: "Não Documentado", 64: "Unidade Intermediária", 65: "Unidade Intermediária Neonatal", 74: "UTI Adulto - Tipo I", 75: "UTI Adulto - Tipo II", 76: "UTI Adulto - Tipo III", 77: "UTI Infantil - Tipo I", 78: "UTI Infantil - Tipo II", 79: "UTI Infantil - Tipo III", 80: "UTI Neonatal - Tipo I", 81: "UTI Neonatal - Tipo II", 82: "UTI Neonatal - Tipo III", 83: "UTI de Queimados", 85: "UTI Coronariana tipo II - UCO tipo II", 86: "UTI Coronariana tipo III - UCO tipo III", 87: "Saúde Mental - Longa Permanência", 88: "Queimado Clínico Adulto", 89: "Queimado Clínico Pediátrico", 90: "Queimado Cirúrgico Adulto", 91: "Queimado Cirúrgico Pediátrico", 92: "UCI Neonatal Convencional", 93: "UCI Neonatal Canguru", 94: "UCI Pediátrica", 95: "UCI Adulto"}
    caveat: "No fato só aparecem 1-14, 17 e 87. Os códigos de UTI (74-95) NÃO aparecem em ESPEC — para UTI use MARCA_UTI."

  marca_uti:
    role: dimensao
    values: {0: "Não utilizou UTI", 1: "Utilizou mais de um tipo de UTI", 51: "UTI adulto - tipo II COVID 19", 52: "UTI pediátrica - tipo II COVID 19", 74: "UTI adulto - tipo I", 75: "UTI adulto - tipo II", 76: "UTI adulto - tipo III", 77: "UTI infantil - tipo I", 78: "UTI infantil - tipo II", 79: "UTI infantil - tipo III", 80: "UTI neonatal - tipo I", 81: "UTI neonatal - tipo II", 82: "UTI neonatal - tipo III", 83: "UTI de queimados", 85: "UTI coronariana tipo II - UCO tipo II", 86: "UTI coronariana tipo III - UCO tipo III", 99: "UTI Doador"}
    caveat: "'Usou UTI' = MARCA_UTI > 0 (9.107.197 internações, 6,3%)."

  instrucao:
    role: dimensao
    values: {0: "Não informado", 1: "Analfabeto", 2: "1º grau", 3: "2º grau", 4: "3º grau", 9: "Ignorado"}
    caveat: "O fato contém também 5, 6 e 8, ausentes desta dimensão. Use LEFT JOIN."

  vincprev:
    role: dimensao
    values: {0: "Não informado", 1: "Autônomo", 2: "Desempregado", 3: "Aposentado", 4: "Não segurado", 5: "Empregado", 6: "Empregador"}

  etnia:        {role: dimensao, rows: 265, description: "Etnias indígenas. Colunas: ETNIA, DESCRICAO."}
  nacionalidade: {role: dimensao, rows: 333, description: "Nacionalidades. Colunas: NACIONAL, DESCRICAO."}
  cbor:         {role: dimensao, rows: 2813, description: "Ocupações CBO. Colunas: CBOR, DESCRICAO."}
  contraceptivos: {role: dimensao, rows: 13, description: "Métodos contraceptivos. Colunas: CONTRACEPTIVO, DESCRICAO."}

# -----------------------------------------------------------------------------
# TABELAS PROIBIDAS
# -----------------------------------------------------------------------------
forbidden_tables:
  _staging_internacoes: "Tabela de carga intermediária (39.622.048 linhas, subconjunto parcial). NUNCA consulte."
  hospital: "VAZIA (0 linhas). Não há nome de hospital, natureza, gestão nem município do estabelecimento."
  socioeconomico: "VAZIA (0 linhas). Não há população, PIB per capita, leitos SUS, médicos nem mortalidade infantil."

# -----------------------------------------------------------------------------
# JUNÇÕES CANÔNICAS
# -----------------------------------------------------------------------------
joins:
  - "internacoes.MUNIC_RES      = municipios.CO_MUNICIPIO_6D   -- 100% de cobertura"
  - "internacoes.DIAG_PRINC     = cid.CID                      -- LEFT JOIN (777 órfãos)"
  - "internacoes.PROC_REA       = procedimentos.PROC_REA       -- LEFT JOIN (370 órfãos)"
  - "internacoes.SEXO           = sexo.SEXO"
  - "internacoes.RACA_COR       = raca_cor.RACA_COR"
  - "internacoes.CAR_INT        = car_int.CAR_INT"
  - "internacoes.ESPEC          = especialidade.ESPEC"
  - "internacoes.COMPLEX        = complexidade.COMPLEX"
  - "internacoes.MARCA_UTI      = marca_uti.MARCA_UTI"
  - "internacoes.INSTRU         = instrucao.INSTRU             -- LEFT JOIN"
  - "internacoes.VINCPREV       = vincprev.VINCPREV"
  - "internacoes.CBOR           = cbor.CBOR"
  - "internacoes.ETNIA          = etnia.ETNIA"
  - "internacoes.NACIONAL       = nacionalidade.NACIONAL"

# -----------------------------------------------------------------------------
# REGRAS CRÍTICAS — violá-las produz resultado silenciosamente errado
# -----------------------------------------------------------------------------
rules:
  - id: sexo_feminino
    severity: critica
    text: |
      NUNCA escreva `SEXO = 2` para "mulheres/feminino": o valor 2 NÃO EXISTE no
      fato e a query retorna ZERO linhas. No fato, feminino = 3 e masculino = 1.
      Forma correta: `SEXO IN (2, 3)` ou junte com a dimensão `sexo` e filtre por
      `DESCRICAO = 'Feminino'`. Distribuição real: masculino 58.967.743,
      feminino 85.419.029 (a maioria por causa de partos).

  - id: cid_sem_ponto
    severity: critica
    text: |
      Códigos CID no banco NÃO TÊM PONTO. O usuário costuma escrever "J18.9" ou
      "I21"; converta para 'J189' / 'I21' antes de filtrar. Para pegar uma
      categoria inteira (todas as subcategorias de J18), use
      `DIAG_PRINC LIKE 'J18%'`, não `= 'J18'`.

  - id: periodo_2007_parcial
    severity: alta
    text: |
      2007 tem apenas ago-dez (431.437 internações) — é um ano PARCIAL. Nunca o
      inclua em comparações "qual ano teve mais/menos" nem em séries anuais sem
      avisar. Anos completos: 2008 a 2023.

  - id: nao_inner_join_tempo
    severity: alta
    text: |
      A dimensão `tempo` só cobre 2008-2023. INNER JOIN com ela descarta 2007
      silenciosamente. Use `year(DT_SAIDA)` / `month(DT_SAIDA)` diretamente.

  - id: geografia_e_residencia
    severity: alta
    text: |
      A única geografia disponível é a RESIDÊNCIA DO PACIENTE (MUNIC_RES). Como
      a tabela `hospital` está vazia, é IMPOSSÍVEL saber onde o atendimento
      ocorreu. Se a pergunta for sobre o local do hospital ("internações NOS
      hospitais de SP"), responda que a base só permite recorte por residência
      e entregue esse recorte, deixando a limitação explícita.

  - id: recorte_temporal_por_saida
    severity: media
    text: |
      "Internações em 2020" = `year(DT_SAIDA) = 2020` (critério de competência
      da base). Só use DT_INTER se o usuário pedir explicitamente pela data de
      entrada; nesse caso avise que o resultado difere.

  - id: valores_nominais
    severity: media
    text: |
      VAL_TOT é nominal (sem correção inflacionária). Ao comparar valores entre
      anos distantes, avise que não estão deflacionados.

  - id: taxa_mortalidade
    severity: media
    text: |
      Taxa de mortalidade = `AVG(MORTE::INT)` ou
      `COUNT(*) FILTER (WHERE MORTE) * 1.0 / COUNT(*)`. Expresse em % e, em
      rankings por grupo, imponha um mínimo de casos (ex.: HAVING COUNT(*) >=
      1000) para não trazer grupos minúsculos com 100%.

  - id: acentuacao_por_tabela
    severity: alta
    text: |
      A acentuação varia POR TABELA — não generalize:
      - municipios.NO_MUNICIPIO TEM acento ('São Paulo', 'Ribeirão Preto').
        Filtrar por 'Sao Paulo' devolve ZERO. Forma robusta:
        `strip_accents(NO_MUNICIPIO) = strip_accents('São Paulo')`.
      - cid.DESCRICAO é praticamente SEM acento (só 41 de 14.253 têm).
      - procedimentos.NOME_PROC é MAIÚSCULO e sem acento, com 109 nomes
        contendo lixo de codificação.
      Nomes de município se repetem entre UFs — sempre desempate com SG_UF.

  - id: sp_e_to_ausentes
    severity: critica
    text: |
      COBERTURA INCOMPLETA: São Paulo (88.884 internações) e Tocantins (38.425)
      estão praticamente AUSENTES desta base, em todos os anos. Para comparação,
      Minas Gerais tem 19.276.203 e Roraima — a menor UF do país — tem 598.101.
      Isso NÃO é um achado epidemiológico, é uma falha de extração.
      Portanto: em qualquer ranking, comparação ou mapa por UF, avise
      explicitamente que SP e TO estão subrepresentados e não devem ser
      interpretados. Nunca afirme que "SP tem poucas internações".

  - id: placeholder_zero_nao_null
    severity: critica
    text: |
      TRÊS COLUNAS USAM A STRING '0' NO LUGAR DE NULL, e nunca são nulas:
      DIAG_SECUN ('0' em 95,5%), CID_MORTE ('0' em 98,6%) e CID_NOTIF ('0' em
      99,2%). O mesmo vale para CBOR, que usa '000000' em 99,99%.
      Consequência: `WHERE DIAG_SECUN IS NOT NULL` casa TODAS as 144.386.772
      linhas e devolve uma resposta absurda sem dar erro. O correto é
      `WHERE DIAG_SECUN <> '0'` (6.531.950 linhas).
      As colunas DIAGSEC1..DIAGSEC9 são a exceção: essas usam NULL de verdade.

  - id: cid_morte_e_diag_secun_param_em_2015
    severity: critica
    text: |
      DIAG_SECUN e CID_MORTE PARAM DE SER PREENCHIDOS EM 2015. A cobertura cai
      de um ano para o outro e nunca volta:

        ano     DIAG_SECUN   CID_MORTE
        2013        12,3%        3,7%
        2014        12,0%        3,5%
        2015         0,0%        0,0%   <- corte
        2023         0,0%        0,0%

      Consequência: qualquer série temporal baseada nessas colunas despenca a
      zero em 2015 e parece dizer que o fenômeno acabou. Uma pergunta como
      "evolução de mortes por câncer ao longo dos anos" respondida com
      CID_MORTE produz um gráfico que sugere fim dos óbitos por câncer — quando
      o que acabou foi o preenchimento do campo.

      Regras:
        - Ao usar CID_MORTE ou DIAG_SECUN, RESTRINJA a 2007-2014 e diga isso.
        - Nunca faça série temporal dessas colunas cobrindo 2015 em diante.
        - Para causa de óbito depois de 2014, a única aproximação disponível é
          DIAG_PRINC das internações com MORTE — que é o motivo da internação,
          não a causa da morte. Diga a diferença ao usuário.

  - id: colunas_sociodemograficas_vazias
    severity: alta
    text: |
      Cinco campos sociodemográficos estão praticamente não preenchidos e não
      sustentam análise:
        VINCPREV   99,99% "não informado" (só 17.533 linhas preenchidas)
        CBOR       99,99% '000000'
        ETNIA      99,75% "não informado"
        NUM_FILHOS 100,00% zero
        INSTRU     99,17% "não informado"
        NACIONAL   99,76% Brasil
      Pode-se responder "quantos têm X informado", mas qualquer quebra de
      métrica POR escolaridade, ocupação, etnia ou vínculo é enganosa. Nesses
      casos devolva o resultado e avise que a cobertura é inferior a 1%.

  - id: ind_vdrl_nao_e_positivo
    severity: alta
    text: |
      IND_VDRL indica que o exame VDRL foi REGISTRADO, não que deu positivo.
      São 22.840.654 linhas TRUE (15,8%) — tratá-las como "casos de sífilis"
      seria clinicamente absurdo. Se o usuário pedir "VDRL positivo", explique
      que a base só informa a realização do exame.

  - id: agrupar_por_codigo_nao_por_rotulo
    severity: critica
    text: |
      Ao agrupar por diagnóstico ou procedimento, agrupe pelo CÓDIGO e use a
      descrição apenas como rótulo:
        GROUP BY i.DIAG_PRINC, c.DESCRICAO     -- correto
        GROUP BY c.DESCRICAO                   -- errado
      Motivo: 293 descrições da tabela `cid` são compartilhadas por mais de um
      código. "Fazenda" cobre 217 códigos (W007, W017, W027, …), porque é o
      LOCAL da causa externa, não um diagnóstico. Agrupar pelo texto funde
      códigos distintos, infla as contagens e muda quem entra num top-N.

  - id: uti_indicador_vs_valor
    severity: alta
    text: |
      Duas colunas descrevem UTI e não são intercambiáveis:
        MARCA_UTI > 0  -> USOU UTI. 9.107.197 internações. É o indicador.
        VAL_UTI   > 0  -> teve VALOR de UTI faturado. 9.193.933 internações.
      A diferença são 86.736 internações com valor lançado sem marcação de UTI.
      Regra: para CONTAR internações em UTI use MARCA_UTI > 0; para somar ou
      tirar média de dinheiro use VAL_UTI, filtrando por MARCA_UTI > 0 quando a
      pergunta for sobre quem passou pela UTI.

  - id: razao_ou_percentual
    severity: media
    text: |
      Quando a pergunta pedir "razão" ou "proporção" entre dois grupos sem
      dizer a unidade, devolva a RAZÃO simples (homens/mulheres = 1,43) e diga
      no texto o que ela significa. Só multiplique por 100 se a pergunta usar
      as palavras "percentual", "porcentagem" ou "%".
      Em percentuais sobre subconjunto, deixe explícito qual é o denominador —
      "18% das internações respiratórias" e "9,8% de todas as internações do
      trimestre" são respostas diferentes para a mesma frase ambígua.

  - id: colunas_inutilizaveis
    severity: critica
    text: |
      Duas colunas do fato estão corrompidas e NÃO devem ser usadas:
      - GESTRISCO: TRUE em 99,6% das linhas, inclusive em 58,8 milhões de
        pacientes masculinos.
      - UTI_INT_TO: zero em 9.107.168 das 9.107.197 internações com UTI.
      Se a pergunta depender de uma delas, responda que o dado é inconsistente
      na base e ofereça a alternativa mais próxima (para UTI, use MARCA_UTI > 0
      ou VAL_UTI).

  - id: sem_limit_gigante
    severity: media
    text: |
      O fato tem 144M linhas. Nunca faça SELECT sem agregação ou sem LIMIT.
      Toda query exploratória deve terminar com LIMIT.

# -----------------------------------------------------------------------------
# EXEMPLOS (few-shot)
# -----------------------------------------------------------------------------
examples:
  - question: "Quantas internações de mulheres houve em 2019?"
    sql: |
      SELECT COUNT(*) AS total
      FROM internacoes
      WHERE SEXO IN (2, 3) AND year(DT_SAIDA) = 2019;
    note: "Demonstra a regra do SEXO e o recorte por DT_SAIDA."

  - question: "Quais os 5 diagnósticos com maior mortalidade entre idosos?"
    sql: |
      SELECT c.DESCRICAO AS diagnostico,
             COUNT(*) AS internacoes,
             ROUND(100.0 * AVG(i.MORTE::INT), 2) AS taxa_obito_pct
      FROM internacoes i
      LEFT JOIN cid c ON i.DIAG_PRINC = c.CID
      WHERE i.IDADE >= 60
      GROUP BY 1
      HAVING COUNT(*) >= 1000
      ORDER BY taxa_obito_pct DESC
      LIMIT 5;
    note: "Demonstra o HAVING de volume mínimo em ranking de taxa."

  - question: "Custo médio de internação por UF em 2023"
    sql: |
      SELECT m.SG_UF AS uf,
             COUNT(*) AS internacoes,
             ROUND(AVG(i.VAL_TOT), 2) AS custo_medio
      FROM internacoes i
      JOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D
      WHERE year(i.DT_SAIDA) = 2023
      GROUP BY 1
      ORDER BY custo_medio DESC;
    note: "UF é a da RESIDÊNCIA do paciente."
