- id: gt_gt083
  question: Qual é a taxa de mortalidade por nível de instrução no estado do RS, considerando apenas grupos
    com mais de 1000 internações?
  category: taxa
  difficulty: dificil
  ordered: true
  tests: 'HARD: computed CASE WHEN mortality rate + 2 JOINs (instrucao + municipios) + HAVING threshold
    + estado filter. Returns 4 education groups with INSTRU data in RS. | Gold corrigido: JOIN instrucao
    -> LEFT JOIN (instrucao tem códigos órfãos no fato)'
  gold_sql: SELECT ins."DESCRICAO", COUNT(*) AS total_internacoes, SUM(CASE WHEN i."MORTE" = true THEN
    1 ELSE 0 END) AS total_mortes, ROUND(SUM(CASE WHEN i."MORTE" = true THEN 1 ELSE 0 END) * 100.0 / COUNT(*),
    2) AS taxa_mortalidade FROM internacoes i LEFT JOIN instrucao ins ON i."INSTRU" = ins."INSTRU" JOIN
    municipios mu ON i."MUNIC_RES" = mu."CO_MUNICIPIO_6D" WHERE mu."SG_UF" = 'RS' AND i."INSTRU" IS NOT
    NULL AND i."INSTRU" != 0 GROUP BY ins."DESCRICAO" HAVING COUNT(*) > 1000 ORDER BY taxa_mortalidade
    DESC;
  origem: GT083
