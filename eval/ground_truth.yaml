- id: gt_gt204
  question: Quais sao os 3 CIDs com maior taxa de mortalidade em cada estado MA e RS, considerando CIDs
    com mais de 1000 internacoes?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'Tema: mortalidade hospitalar. Metrica: top_n_per_group_mortality. Denominador/escopo: CIDs com
    mais de 1000 internacoes por UF. Usa ROW_NUMBER por UF e HAVING para evitar CIDs raros. | Gold corrigido:
    JOIN cid -> LEFT JOIN (cid tem códigos órfãos no fato)'
  gold_sql: WITH agg AS (SELECT m."SG_UF" AS uf, c."DESCRICAO" AS diagnostico, COUNT(*) AS total_internacoes,
    SUM(CASE WHEN i."MORTE" = true THEN 1 ELSE 0 END) AS total_mortes, ROUND(SUM(CASE WHEN i."MORTE" =
    true THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS taxa_mortalidade FROM internacoes i LEFT
    JOIN municipios m ON i."MUNIC_RES" = m."CO_MUNICIPIO_6D" LEFT JOIN cid c ON i."DIAG_PRINC" = c."CID"
    WHERE m."SG_UF" IN ('MA', 'RS') GROUP BY m."SG_UF", c."DESCRICAO" HAVING COUNT(*) > 1000), ranked
    AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY uf ORDER BY taxa_mortalidade DESC, total_internacoes
    DESC) AS rn FROM agg) SELECT uf, diagnostico, total_internacoes, total_mortes, taxa_mortalidade FROM
    ranked WHERE rn <= 3 ORDER BY uf, rn;
  origem: GT204
- id: gt_gt205
  question: Quais municipios do RS tem taxa de uso de UTI acima da media estadual, considerando apenas
    municipios com mais de 1000 internacoes?
