- id: gt_gt213
  question: Como a taxa de mortalidade compara internacoes de urgencia e eletivas por faixa etaria?
  category: agregacao_complexa
  difficulty: dificil
  tests: 'Tema: mortalidade hospitalar. Metrica: mortality_rate_cross_tab. Denominador/escopo: internacoes
    por faixa e carater. Cruzamento faixa etaria x urgencia/eletiva com taxa de mortalidade.'
  gold_sql: WITH base AS (SELECT CASE WHEN "IDADE" < 18 THEN '<18' WHEN "IDADE" BETWEEN 18 AND 39 THEN
    '18-39' WHEN "IDADE" BETWEEN 40 AND 59 THEN '40-59' WHEN "IDADE" BETWEEN 60 AND 79 THEN '60-79' ELSE
    '80+' END AS faixa_etaria, CASE WHEN "IDADE" < 18 THEN 1 WHEN "IDADE" BETWEEN 18 AND 39 THEN 2 WHEN
    "IDADE" BETWEEN 40 AND 59 THEN 3 WHEN "IDADE" BETWEEN 60 AND 79 THEN 4 ELSE 5 END AS ordem, CASE WHEN
    "CAR_INT" = 1 THEN 'eletiva' WHEN "CAR_INT" = 2 THEN 'urgencia' ELSE 'outros' END AS carater, "MORTE"
    FROM internacoes WHERE "IDADE" IS NOT NULL AND "CAR_INT" IN (1, 2)) SELECT faixa_etaria, carater,
    COUNT(*) AS total_internacoes, SUM(CASE WHEN "MORTE" = true THEN 1 ELSE 0 END) AS total_mortes, ROUND(SUM(CASE
    WHEN "MORTE" = true THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS taxa_mortalidade FROM
