  difficulty: dificil
  ordered: true
  tests: 'Tema: UTI. Metrica: above_average_rate. Denominador/escopo: municipios RS com mais de 1000 internacoes.
    Calcula taxa municipal de UTI e compara com media ponderada do RS. | Gold corrigido: removido LIMIT
    que a pergunta não pede'
  gold_sql: WITH rs AS (SELECT m."NO_MUNICIPIO" AS municipio, COUNT(*) AS total_internacoes, SUM(CASE
    WHEN i."MARCA_UTI" <> 0 THEN 1 ELSE 0 END) AS internacoes_uti FROM internacoes i LEFT JOIN municipios
    m ON i."MUNIC_RES" = m."CO_MUNICIPIO_6D" WHERE m."SG_UF" = 'RS' GROUP BY m."NO_MUNICIPIO"), media
    AS (SELECT SUM(internacoes_uti) * 100.0 / NULLIF(SUM(total_internacoes), 0) AS taxa_media_rs FROM
    rs) SELECT rs.municipio, rs.total_internacoes, rs.internacoes_uti, ROUND(rs.internacoes_uti * 100.0
    / NULLIF(rs.total_internacoes, 0), 2) AS taxa_uti FROM rs, media WHERE rs.total_internacoes > 1000
    AND rs.internacoes_uti * 100.0 / NULLIF(rs.total_internacoes, 0) > media.taxa_media_rs ORDER BY taxa_uti
    DESC;
