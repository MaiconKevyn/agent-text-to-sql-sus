cases:
- id: agg_total_internacoes
  question: Quantas internações existem na base no total?
  category: agregacao_simples
  difficulty: facil
  tests: Contagem básica sem filtro.
  gold_sql: 'SELECT COUNT(*) AS total_internacoes FROM internacoes;

    '
- id: agg_total_obitos
  question: Quantos óbitos foram registrados no total?
  category: agregacao_simples
  difficulty: facil
  tests: Uso do booleano MORTE.
  gold_sql: 'SELECT COUNT(*) AS total_obitos FROM internacoes WHERE MORTE;

    '
- id: agg_valor_total
  question: Qual o valor total gasto com internações em toda a base?
  category: agregacao_simples
  difficulty: facil
  tests: SUM sobre VAL_TOT.
  gold_sql: 'SELECT ROUND(SUM(VAL_TOT), 2) AS valor_total FROM internacoes;

    '
- id: agg_media_permanencia
  question: Qual a média de dias de permanência das internações?
  category: agregacao_simples
  difficulty: facil
  tests: AVG simples.
  gold_sql: 'SELECT ROUND(AVG(DIAS_PERM), 4) AS media_dias FROM internacoes;

    '
- id: agg_taxa_mortalidade_geral
  question: Qual a taxa de mortalidade hospitalar geral?
  category: taxa
  difficulty: facil
  tests: Razão óbitos/total expressa em %.
  gold_sql: 'SELECT ROUND(100.0 * AVG(MORTE::INT), 4) AS taxa_mortalidade_pct

    FROM internacoes;

    '
- id: temp_internacoes_2020
  question: Quantas internações houve em 2020?
  category: temporal
  difficulty: facil
  tests: Recorte por ano usando DT_SAIDA (competência da base).
  gold_sql: 'SELECT COUNT(*) AS total FROM internacoes WHERE year(DT_SAIDA) = 2020;

    '
- id: temp_marco_2021
  question: Quantas internações foram registradas em março de 2021?
  category: temporal
  difficulty: facil
  tests: Filtro de ano + mês.
  gold_sql: 'SELECT COUNT(*) AS total

    FROM internacoes

    WHERE year(DT_SAIDA) = 2021 AND month(DT_SAIDA) = 3;

    '
- id: temp_intervalo_2015_2019
  question: Quantas internações ocorreram entre 2015 e 2019?
  category: temporal
  difficulty: facil
  tests: Intervalo fechado de anos.
  gold_sql: 'SELECT COUNT(*) AS total

    FROM internacoes

    WHERE year(DT_SAIDA) BETWEEN 2015 AND 2019;

    '
- id: temp_serie_anual
  question: Mostre a evolução do número de internações por ano.
  category: temporal
  difficulty: media
  ordered: true
  tests: Série anual completa — inclusive 2007, que é ano parcial. A resposta deve sinalizar isso.
  answer_must_mention:
  - - '2007'
  - - parcial
    - incompleto
    - agosto
    - só 5 meses
    - cinco meses
  gold_sql: 'SELECT year(DT_SAIDA) AS ano, COUNT(*) AS internacoes

    FROM internacoes

    GROUP BY 1

    ORDER BY 1;

    '
- id: temp_ano_mais_obitos
  question: Qual ano teve o maior número de óbitos?
  category: temporal
  difficulty: media
  ordered: true
  tests: Ranking temporal — o pico é 2021 (COVID).
  gold_sql: 'SELECT year(DT_SAIDA) AS ano, COUNT(*) AS obitos

    FROM internacoes

    WHERE MORTE

    GROUP BY 1

    ORDER BY obitos DESC

    LIMIT 1;

    '
- id: temp_sazonalidade_mensal
  question: Em quais meses do ano há mais internações? Considere todo o período.
  category: temporal
  difficulty: media
  ordered: true
  tests: Agregação por mês do calendário, ignorando o ano.
  gold_sql: 'SELECT month(DT_SAIDA) AS mes, COUNT(*) AS internacoes

    FROM internacoes

    GROUP BY 1

    ORDER BY internacoes DESC;

    '
- id: temp_ano_completo_menor_volume
  question: Considerando apenas anos completos, qual ano teve menos internações?
  category: armadilha
  difficulty: dificil
  ordered: true
  tests: 'ARMADILHA: 2007 é parcial (ago-dez) e deve ser excluído; resposta correta é 2020. O gold devolve
    só o ano — que é o que a pergunta pede.'
  gold_sql: 'SELECT year(DT_SAIDA) AS ano

    FROM internacoes

    WHERE year(DT_SAIDA) BETWEEN 2008 AND 2023

    GROUP BY 1

    ORDER BY COUNT(*) ASC

    LIMIT 1;

    '
- id: demo_mulheres_2019
  question: Quantas internações de mulheres houve em 2019?
  category: armadilha
  difficulty: media
  tests: 'ARMADILHA CRÍTICA: SEXO=2 não existe no fato; feminino é 3.'
  gold_sql: 'SELECT COUNT(*) AS total

    FROM internacoes

    WHERE SEXO IN (2, 3) AND year(DT_SAIDA) = 2019;

    '
- id: demo_por_sexo
  question: Qual a distribuição de internações por sexo?
  category: armadilha
  difficulty: media
  tests: 'ARMADILHA: agrupar por código produz 1 e 3; agrupar pelo rótulo consolida em Masculino/Feminino.'
  gold_sql: 'SELECT s.DESCRICAO AS sexo, COUNT(*) AS internacoes

    FROM internacoes i

    JOIN sexo s ON i.SEXO = s.SEXO

    GROUP BY 1

    ORDER BY internacoes DESC;

    '
- id: demo_homens_idosos
  question: Quantas internações de homens com 60 anos ou mais existem na base?
  category: filtro
  difficulty: facil
  tests: Filtro combinado de sexo e idade.
  gold_sql: 'SELECT COUNT(*) AS total

    FROM internacoes

    WHERE SEXO = 1 AND IDADE >= 60;

    '
- id: demo_raca_cor
  question: Quantas internações por raça/cor do paciente?
  category: join_dimensao
  difficulty: facil
  tests: Join com raca_cor. A resposta deve destacar que 'Sem informação' é a 2ª maior categoria (29,2%),
    à frente de 'Branca'.
  answer_must_mention:
  - - sem informação
    - sem informacao
    - não informad
    - nao informad
    - ignorad
  gold_sql: 'SELECT r.DESCRICAO AS raca_cor, COUNT(*) AS internacoes

    FROM internacoes i

    JOIN raca_cor r ON i.RACA_COR = r.RACA_COR

    GROUP BY 1

    ORDER BY internacoes DESC;

    '
- id: demo_menores_1_ano
  question: Quantas internações foram de bebês com menos de 1 ano?
  category: filtro
  difficulty: facil
  tests: Filtro IDADE < 1.
  gold_sql: 'SELECT COUNT(*) AS total FROM internacoes WHERE IDADE < 1;

    '
- id: demo_faixa_etaria
  question: 'Distribua as internações por faixa etária: menores de 1 ano, 1 a 14, 15 a 59 e 60 ou mais.'
  category: agregacao_complexa
  difficulty: media
  tests: CASE WHEN para faixas etárias.
  gold_sql: "SELECT CASE\n         WHEN IDADE < 1 THEN 'menor de 1 ano'\n         WHEN IDADE < 15 THEN\
    \ '1 a 14'\n         WHEN IDADE < 60 THEN '15 a 59'\n         ELSE '60 ou mais'\n       END AS faixa_etaria,\n\
    \       COUNT(*) AS internacoes\nFROM internacoes\nGROUP BY 1\nORDER BY internacoes DESC;\n"
- id: demo_idade_media_por_sexo
  question: Qual a idade média dos pacientes internados, por sexo?
  category: join_dimensao
  difficulty: media
  tests: AVG com quebra pelo rótulo do sexo.
  gold_sql: 'SELECT s.DESCRICAO AS sexo, ROUND(AVG(i.IDADE), 4) AS idade_media

    FROM internacoes i

    JOIN sexo s ON i.SEXO = s.SEXO

    GROUP BY 1

    ORDER BY idade_media DESC;

    '
- id: cid_top10_diagnosticos
  question: Quais são os 10 diagnósticos principais mais frequentes?
  category: join_dimensao
  difficulty: media
  ordered: true
  tests: Join com cid e ranking.
  gold_sql: 'SELECT c.DESCRICAO AS diagnostico, COUNT(*) AS internacoes

    FROM internacoes i

    LEFT JOIN cid c ON i.DIAG_PRINC = c.CID

    GROUP BY 1

    ORDER BY internacoes DESC

    LIMIT 10;

    '
- id: cid_pneumonia_categoria
  question: Quantas internações tiveram pneumonia não especificada (J18.9) como diagnóstico principal?
  category: armadilha
  difficulty: media
  tests: 'ARMADILHA: o usuário escreve J18.9 mas o banco guarda ''J189'' (sem ponto).'
  gold_sql: 'SELECT COUNT(*) AS total FROM internacoes WHERE DIAG_PRINC = ''J189'';

    '
- id: cid_categoria_j18_completa
  question: Qual o total de internações por pneumonia (categoria J18, somando todas as subcategorias)?
    Quero um número único.
  category: armadilha
  difficulty: dificil
  tests: 'ARMADILHA: precisa de LIKE ''J18%'' para pegar J180..J189 e a própria J18.'
  gold_sql: 'SELECT COUNT(*) AS total FROM internacoes WHERE DIAG_PRINC LIKE ''J18%'';

    '
- id: cid_infarto_2023
  question: Quantas internações por infarto agudo do miocárdio ocorreram em 2023?
  category: dominio
  difficulty: dificil
  tests: Requer mapear 'infarto agudo do miocárdio' para a categoria CID I21.
  gold_sql: 'SELECT COUNT(*) AS total

    FROM internacoes

    WHERE DIAG_PRINC LIKE ''I21%'' AND year(DT_SAIDA) = 2023;

    '
- id: cid_por_capitulo
  question: Quantas internações por capítulo da CID-10?
  category: join_dimensao
  difficulty: media
  tests: 'Uso da hierarquia DS_CAPITULO com LEFT JOIN, como manda a regra do dicionário: os 777 CIDs órfãos
    viram um 23º grupo em vez de sumirem.'
  gold_sql: "SELECT COALESCE(c.DS_CAPITULO, 'Sem capítulo conhecido') AS capitulo,\n       COUNT(*) AS\
    \ internacoes\nFROM internacoes i\nLEFT JOIN cid c ON i.DIAG_PRINC = c.CID\nGROUP BY 1\nORDER BY internacoes\
    \ DESC;\n"
- id: cid_letalidade_top
  question: Quais os 10 diagnósticos com a maior taxa de mortalidade? Considere apenas os com pelo menos
    10 mil internações.
  category: taxa
  difficulty: dificil
  ordered: true
  tests: Taxa por grupo com HAVING de volume mínimo.
  gold_sql: "SELECT c.DESCRICAO AS diagnostico,\n       COUNT(*) AS internacoes,\n       ROUND(100.0 *\
    \ AVG(i.MORTE::INT), 4) AS taxa_mortalidade_pct\nFROM internacoes i\nJOIN cid c ON i.DIAG_PRINC =\
    \ c.CID\nGROUP BY 1\nHAVING COUNT(*) >= 10000\nORDER BY taxa_mortalidade_pct DESC\nLIMIT 10;\n"
- id: cid_diabetes_permanencia
  question: Qual a média de dias de permanência das internações por diabetes mellitus (E10 a E14)?
  category: dominio
  difficulty: dificil
  tests: Faixa de categorias CID via LIKE múltiplo ou BETWEEN. O gold devolve só a média — que é o que
    a pergunta pede.
  gold_sql: 'SELECT ROUND(AVG(DIAS_PERM), 4) AS media_dias

    FROM internacoes

    WHERE DIAG_PRINC >= ''E10'' AND DIAG_PRINC < ''E15'';

    '
- id: proc_top5
  question: Quais os 5 procedimentos mais realizados?
  category: join_dimensao
  difficulty: media
  ordered: true
  tests: Join com procedimentos.
  gold_sql: 'SELECT p.NOME_PROC AS procedimento, COUNT(*) AS total

    FROM internacoes i

    JOIN procedimentos p ON i.PROC_REA = p.PROC_REA

    GROUP BY 1

    ORDER BY total DESC

    LIMIT 5;

    '
- id: proc_partos_cesarea_vs_normal
  question: Quantos partos normais e quantas cesáreas foram realizados, somando todas as variantes desses
    procedimentos?
  category: dominio
  difficulty: dificil
  tests: 'Mapear o conceito clínico para TODAS as variantes: parto normal (comum, alto risco, CPN) e cesárea
    (comum, alto risco, com laqueadura). Contar só ''PARTO NORMAL'' e ''PARTO CESARIANO'' subestima em
    1,2 e 2,0 milhões.'
  gold_sql: "SELECT CASE\n         WHEN i.PROC_REA IN ('0310010039','0310010047','0310010055') THEN 'Parto\
    \ normal'\n         ELSE 'Cesárea'\n       END AS tipo_parto,\n       COUNT(*) AS total\nFROM internacoes\
    \ i\nWHERE i.PROC_REA IN ('0310010039','0310010047','0310010055',\n                     '0411010034','0411010026','0411010042')\n\
    GROUP BY 1\nORDER BY total DESC;\n"
- id: proc_custo_medio_top
  question: Quais os 10 procedimentos com maior custo médio? Considere só os com pelo menos mil realizações.
  category: taxa
  difficulty: dificil
  ordered: true
  tests: Média de valor por grupo com HAVING.
  gold_sql: "SELECT p.NOME_PROC AS procedimento,\n       COUNT(*) AS realizacoes,\n       ROUND(AVG(i.VAL_TOT),\
    \ 4) AS custo_medio\nFROM internacoes i\nJOIN procedimentos p ON i.PROC_REA = p.PROC_REA\nGROUP BY\
    \ 1\nHAVING COUNT(*) >= 1000\nORDER BY custo_medio DESC\nLIMIT 10;\n"
- id: geo_por_uf
  question: Quantas internações por estado de residência do paciente?
  category: join_dimensao
  difficulty: media
  tests: Join com municipios e agregação por UF.
  gold_sql: 'SELECT m.SG_UF AS uf, COUNT(*) AS internacoes

    FROM internacoes i

    JOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D

    GROUP BY 1

    ORDER BY internacoes DESC;

    '
- id: geo_top10_municipios
  question: Quais os 10 municípios de residência com mais internações?
  category: join_dimensao
  difficulty: media
  ordered: true
  tests: Ranking por município, desambiguando pela UF.
  gold_sql: 'SELECT m.NO_MUNICIPIO AS municipio, m.SG_UF AS uf, COUNT(*) AS internacoes

    FROM internacoes i

    JOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D

    GROUP BY 1, 2

    ORDER BY internacoes DESC

    LIMIT 10;

    '
- id: geo_sao_paulo_2023
  question: Quantas internações de moradores de São Paulo (capital) houve em 2023?
  category: armadilha
  difficulty: dificil
  tests: 'ARMADILHA DUPLA: NO_MUNICIPIO É acentuado (''São Paulo'' — filtrar por ''Sao Paulo'' devolve
    0) e há homônimos em outras UFs, exigindo SG_UF=''SP''.'
  gold_sql: "SELECT COUNT(*) AS total\nFROM internacoes i\nJOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D\n\
    WHERE strip_accents(m.NO_MUNICIPIO) = 'Sao Paulo' AND m.SG_UF = 'SP'\n  AND year(i.DT_SAIDA) = 2023;\n"
- id: geo_mortalidade_por_uf
  question: Qual a taxa de mortalidade hospitalar por UF de residência?
  category: taxa
  difficulty: dificil
  tests: Taxa combinada com join geográfico.
  gold_sql: "SELECT m.SG_UF AS uf,\n       COUNT(*) AS internacoes,\n       ROUND(100.0 * AVG(i.MORTE::INT),\
    \ 4) AS taxa_mortalidade_pct\nFROM internacoes i\nJOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D\n\
    GROUP BY 1\nORDER BY taxa_mortalidade_pct DESC;\n"
- id: geo_custo_medio_uf_2023
  question: Qual o custo médio de uma internação por UF em 2023?
  category: taxa
  difficulty: media
  tests: Média de valor com quebra geográfica e temporal.
  gold_sql: 'SELECT m.SG_UF AS uf, ROUND(AVG(i.VAL_TOT), 4) AS custo_medio

    FROM internacoes i

    JOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D

    WHERE year(i.DT_SAIDA) = 2023

    GROUP BY 1

    ORDER BY custo_medio DESC;

    '
- id: uti_total
  question: Quantas internações utilizaram UTI?
  category: armadilha
  difficulty: media
  tests: 'ARMADILHA: ''usou UTI'' = MARCA_UTI > 0, não MARCA_UTI IS NOT NULL.'
  gold_sql: 'SELECT COUNT(*) AS total FROM internacoes WHERE MARCA_UTI > 0;

    '
- id: uti_mortalidade_comparada
  question: A mortalidade é maior entre quem passou pela UTI? Compare quem usou e quem não usou.
  category: taxa
  difficulty: dificil
  tests: Comparação de taxas entre dois grupos derivados.
  gold_sql: "SELECT CASE WHEN MARCA_UTI > 0 THEN 'usou UTI' ELSE 'nao usou UTI' END AS grupo,\n      \
    \ COUNT(*) AS internacoes,\n       ROUND(100.0 * AVG(MORTE::INT), 4) AS taxa_mortalidade_pct\nFROM\
    \ internacoes\nGROUP BY 1\nORDER BY taxa_mortalidade_pct DESC;\n"
- id: dq_diarias_uti
  question: Qual a média de diárias de UTI entre as internações que usaram UTI?
  category: dado_corrompido
  difficulty: dificil
  answerable: false
  tests: UTI_INT_TO é zero em 9.107.168 das 9.107.197 internações com UTI. O chatbot deve apontar a inconsistência
    em vez de devolver 0,0004 como se fosse real.
- id: carint_urgencia_vs_eletivo
  question: Como se distribuem as internações por caráter (eletivo, urgência e demais categorias)?
  category: join_dimensao
  difficulty: media
  tests: Join com car_int, trazendo as 6 categorias presentes no fato.
  gold_sql: 'SELECT ci.DESCRICAO AS carater, COUNT(*) AS internacoes

    FROM internacoes i

    JOIN car_int ci ON i.CAR_INT = ci.CAR_INT

    GROUP BY 1

    ORDER BY internacoes DESC;

    '
- id: complexidade_custo
  question: Qual o custo médio e o total de internações por nível de complexidade?
  category: join_dimensao
  difficulty: media
  tests: Join com complexidade e duas métricas.
  gold_sql: "SELECT co.DESCRICAO AS complexidade,\n       COUNT(*) AS internacoes,\n       ROUND(AVG(i.VAL_TOT),\
    \ 4) AS custo_medio\nFROM internacoes i\nJOIN complexidade co ON i.COMPLEX = co.COMPLEX\nGROUP BY\
    \ 1\nORDER BY internacoes DESC;\n"
- id: especialidade_permanencia
  question: Qual a média de permanência por especialidade do leito?
  category: join_dimensao
  difficulty: media
  tests: Join com especialidade.
  gold_sql: "SELECT e.DESCRICAO AS especialidade,\n       COUNT(*) AS internacoes,\n       ROUND(AVG(i.DIAS_PERM),\
    \ 4) AS media_dias\nFROM internacoes i\nJOIN especialidade e ON i.ESPEC = e.ESPEC\nGROUP BY 1\nORDER\
    \ BY media_dias DESC;\n"
- id: dq_gestacao_risco
  question: Segundo o campo de gestação de risco da base, quantas internações foram de gestação de alto
    risco?
  category: dado_corrompido
  difficulty: dificil
  answerable: false
  tests: GESTRISCO está TRUE em 99,6% das linhas, incluindo 58,8 milhões de homens. O chatbot deve recusar
    em vez de devolver 143.764.198 — e sem inventar uma definição clínica própria por CID para contornar.
- id: dq_sp_subrepresentado
  question: Faça um ranking das UFs por número de internações.
  category: dado_corrompido
  difficulty: dificil
  ordered: true
  tests: O SQL é simples, mas a RESPOSTA deve avisar que SP (88.884) e TO (38.425) estão subrepresentados
    por falha de extração, não por baixa demanda real.
  answer_must_mention:
  - - são paulo
    - sp
  - - subrepresent
    - sub-represent
    - incompleto
    - falha de extração
    - subnotific
  gold_sql: 'SELECT m.SG_UF AS uf, COUNT(*) AS internacoes

    FROM internacoes i

    JOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D

    GROUP BY 1

    ORDER BY internacoes DESC;

    '
- id: multi_mortalidade_faixa_sexo
  question: 'Compare a taxa de mortalidade por faixa etária e sexo, usando as faixas: menores de 1 ano,
    1 a 14, 15 a 59 e 60 ou mais.'
  category: agregacao_complexa
  difficulty: dificil
  tests: Duas quebras simultâneas + taxa; exige a regra do SEXO.
  gold_sql: "SELECT CASE\n         WHEN i.IDADE < 1 THEN 'menor de 1 ano'\n         WHEN i.IDADE < 15\
    \ THEN '1 a 14'\n         WHEN i.IDADE < 60 THEN '15 a 59'\n         ELSE '60 ou mais'\n       END\
    \ AS faixa_etaria,\n       s.DESCRICAO AS sexo,\n       COUNT(*) AS internacoes,\n       ROUND(100.0\
    \ * AVG(i.MORTE::INT), 4) AS taxa_mortalidade_pct\nFROM internacoes i\nJOIN sexo s ON i.SEXO = s.SEXO\n\
    GROUP BY 1, 2\nORDER BY taxa_mortalidade_pct DESC;\n"
- id: multi_custo_ano_complexidade
  question: Como evoluiu o gasto total por ano em alta complexidade?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: Série temporal filtrada por dimensão.
  gold_sql: 'SELECT year(i.DT_SAIDA) AS ano, ROUND(SUM(i.VAL_TOT), 2) AS gasto_total

    FROM internacoes i

    JOIN complexidade co ON i.COMPLEX = co.COMPLEX

    WHERE co.DESCRICAO = ''Alta complexidade''

    GROUP BY 1

    ORDER BY 1;

    '
- id: multi_top_diag_por_uf
  question: Qual o diagnóstico mais frequente em cada UF?
  category: agregacao_complexa
  difficulty: dificil
  tests: Top-1 por grupo — exige window function ou QUALIFY.
  gold_sql: "SELECT uf, diagnostico, internacoes\nFROM (\n  SELECT m.SG_UF AS uf,\n         c.DESCRICAO\
    \ AS diagnostico,\n         COUNT(*) AS internacoes,\n         ROW_NUMBER() OVER (PARTITION BY m.SG_UF\
    \ ORDER BY COUNT(*) DESC) AS rn\n  FROM internacoes i\n  JOIN municipios m ON i.MUNIC_RES = m.CO_MUNICIPIO_6D\n\
    \  JOIN cid c ON i.DIAG_PRINC = c.CID\n  GROUP BY 1, 2\n)\nWHERE rn = 1\nORDER BY internacoes DESC;\n"
- id: multi_variacao_2019_2021
  question: Quanto variou o número de óbitos de 2019 para 2021, em percentual?
  category: agregacao_complexa
  difficulty: dificil
  tests: Comparação entre dois períodos com agregação condicional. O gold devolve só o percentual — que
    é o que a pergunta pede.
  gold_sql: "SELECT ROUND(100.0 * (COUNT(*) FILTER (WHERE year(DT_SAIDA) = 2021)\n                   \
    \ - COUNT(*) FILTER (WHERE year(DT_SAIDA) = 2019))\n             / COUNT(*) FILTER (WHERE year(DT_SAIDA)\
    \ = 2019), 4) AS variacao_pct\nFROM internacoes\nWHERE MORTE;\n"
- id: multi_permanencia_longa
  question: Quantas internações duraram mais de 30 dias e qual o custo médio delas?
  category: filtro
  difficulty: media
  tests: Filtro numérico + duas métricas.
  gold_sql: 'SELECT COUNT(*) AS internacoes, ROUND(AVG(VAL_TOT), 4) AS custo_medio

    FROM internacoes

    WHERE DIAS_PERM > 30;

    '
- id: multi_participacao_uti_no_gasto
  question: Que percentual do gasto total corresponde a UTI?
  category: taxa
  difficulty: dificil
  tests: Razão entre duas somas.
  gold_sql: 'SELECT ROUND(100.0 * SUM(VAL_UTI) / SUM(VAL_TOT), 4) AS pct_gasto_uti

    FROM internacoes;

    '
- id: trap_tempo_2007
  question: Quantas internações houve em 2007?
  category: armadilha
  difficulty: dificil
  tests: 'ARMADILHA: INNER JOIN com a dimensão `tempo` (que começa em 2008) devolveria 0.'
  gold_sql: 'SELECT COUNT(*) AS total FROM internacoes WHERE year(DT_SAIDA) = 2007;

    '
- id: trap_municipios_validos
  question: Quantos municípios distintos aparecem como residência dos pacientes?
  category: armadilha
  difficulty: dificil
  tests: Contagem sobre o fato (5.563), não sobre a dimensão (5.590, que tem 19 linhas-lixo).
  gold_sql: 'SELECT COUNT(DISTINCT MUNIC_RES) AS municipios FROM internacoes;

    '
- id: trap_cnes_distintos
