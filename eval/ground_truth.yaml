    \ desfecho,\n       COUNT(*) AS total_internacoes,\n       COUNT(*) FILTER (WHERE DIAG_SECUN <> '0')\
    \ AS com_diag_secundario,\n       ROUND(100.0 * COUNT(*) FILTER (WHERE DIAG_SECUN <> '0') / COUNT(*),\
    \ 2) AS percentual\nFROM internacoes\nGROUP BY 1, 2\nORDER BY 1, 2;"
