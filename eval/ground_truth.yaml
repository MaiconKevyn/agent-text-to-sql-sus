- id: gt_gt128
  question: Quais são os 10 municípios com mais de 1000 internações que têm taxa de internação em UTI
    mais de duas vezes acima da média nacional?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'HARD: CTE for national avg + cross-join + HAVING with ratio condition comparing local vs 2x
    national. National avg: ~6.01%. Result: 6 municipalities; top: Bagé 13.49%, Cidreira 12.34%, Barra
    do Ribeiro 12.22%. | Gold corrigido: VAL_UTI>0 -> MARCA_UTI>0 (indicador de uso de UTI)'
  gold_sql: "WITH media_nacional AS (\n    SELECT SUM(CASE WHEN MARCA_UTI > 0 THEN 1 ELSE 0 END) * 100.0\
    \ / COUNT(*) AS taxa_uti_nacional\n    FROM internacoes\n)\nSELECT mu.\"NO_MUNICIPIO\" AS nome,\n\
    \       mu.\"SG_UF\" AS estado,\n       COUNT(*) AS total_internacoes,\n       ROUND(SUM(CASE WHEN\
    \ i.MARCA_UTI > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 2) AS taxa_uti_local,\n       ROUND(mn.taxa_uti_nacional,\
    \ 2) AS taxa_uti_nacional\nFROM internacoes i\nJOIN municipios mu ON i.\"MUNIC_RES\" = mu.\"CO_MUNICIPIO_6D\"\
    , media_nacional mn\nGROUP BY mu.\"NO_MUNICIPIO\", mu.\"SG_UF\", mn.taxa_uti_nacional\nHAVING COUNT(*)\
    \ > 1000\n   AND SUM(CASE WHEN i.MARCA_UTI > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*) > 2 * mn.taxa_uti_nacional\n\
    ORDER BY taxa_uti_local DESC\nLIMIT 10;"
  origem: GT128
- id: gt_gt129
  question: Quais códigos CID aparecem como diagnóstico principal em óbitos registrados?
