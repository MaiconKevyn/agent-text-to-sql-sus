    THEN 'respiratoria' ELSE 'nao_respiratoria' END AS grupo, COUNT(*) AS total FROM internacoes WHERE
    "DT_INTER" IS NOT NULL GROUP BY mes, grupo) SELECT mes, grupo, total, ROUND(total * 100.0 / SUM(total)
