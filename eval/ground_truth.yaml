    \    c.\"DESCRICAO\",\n           COUNT(*) AS total,\n           ROW_NUMBER() OVER (PARTITION BY mu.\"\
    SG_UF\" ORDER BY COUNT(*) DESC) AS rn\n    FROM internacoes i\n    JOIN municipios mu ON i.\"MUNIC_RES\"\
    \ = mu.\"CO_MUNICIPIO_6D\"\n    LEFT JOIN cid c ON i.\"DIAG_PRINC\" = c.\"CID\"\n    WHERE i.\"IDADE\"\
    \ > 60 AND mu.\"SG_UF\" IN ('MA', 'RS')\n    GROUP BY mu.\"SG_UF\", c.\"DESCRICAO\"\n) sub\nWHERE\
