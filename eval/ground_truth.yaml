    MAX(total_internacoes) AS max_internacoes, ROUND(AVG(total_internacoes), 0) AS media_internacoes FROM
    (SELECT "CNES", total_internacoes, NTILE(4) OVER (ORDER BY total_internacoes) AS ntile_grupo FROM
