    the previous CID_MORTE anti-join requirement, which is not coherent under the DIAG_PRINC + MORTE=true
    policy. | Gold corrigido: removido LIMIT que a pergunta não pede; JOIN cid -> LEFT JOIN (cid tem códigos
    órfãos no fato)'
