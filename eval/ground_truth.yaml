    taxas AS (SELECT ano, total_internacoes, total_mortes, total_mortes * 100.0 / NULLIF(total_internacoes,
    0) AS taxa_mortalidade FROM anual) SELECT ano, ROUND(AVG(taxa_mortalidade) OVER (ORDER BY ano ROWS
    BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS media_movel_3_anos_taxa_mortalidade FROM taxas ORDER BY
    ano;
  origem: GT216
- id: gt_gt217
  question: Quais capitulos CID tem custo medio acima da media geral e mais de 100000 internacoes?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'Tema: custos. Metrica: above_average_cost. Denominador/escopo: capitulos com >100000 internacoes.
    Usa CTE geral e filtro de volume minimo. | Gold corrigido: JOIN cid -> LEFT JOIN (cid tem códigos
    órfãos no fato)'
  gold_sql: WITH geral AS (SELECT AVG("VAL_TOT") AS custo_medio_geral FROM internacoes WHERE "VAL_TOT"
    IS NOT NULL), por_capitulo AS (SELECT c."DS_CAPITULO" AS capitulo_cid, COUNT(*) AS total_internacoes,
    AVG(i."VAL_TOT") AS custo_medio FROM internacoes i LEFT JOIN cid c ON i."DIAG_PRINC" = c."CID" WHERE
    i."VAL_TOT" IS NOT NULL GROUP BY c."DS_CAPITULO") SELECT p.capitulo_cid, p.total_internacoes, ROUND(p.custo_medio,
    2) AS custo_medio FROM por_capitulo p, geral g WHERE p.total_internacoes > 100000 AND p.custo_medio
    > g.custo_medio_geral ORDER BY p.custo_medio DESC;
