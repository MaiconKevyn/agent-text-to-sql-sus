- id: gt_gt112
  question: Qual o crescimento percentual anual de internações no estado do RS entre 2008 e 2023, retornando
    apenas anos com ano anterior disponível?
  category: agregacao_complexa
  difficulty: dificil
  tests: DT_INTER -> DT_SAIDA (convenção da base).
  gold_sql: WITH internacoes_por_ano AS (SELECT year(i.DT_SAIDA) AS ano, COUNT(*) AS total_internacoes
    FROM internacoes i JOIN municipios mu ON i."MUNIC_RES" = mu."CO_MUNICIPIO_6D" WHERE mu."SG_UF" = 'RS'
    AND i.DT_SAIDA IS NOT NULL AND year(i.DT_SAIDA) BETWEEN 2008 AND 2023 GROUP BY ano), crescimento_percentual
    AS (SELECT ano, total_internacoes, LAG(total_internacoes) OVER (ORDER BY ano) AS total_anterior FROM
    internacoes_por_ano) SELECT ano, total_internacoes, ROUND((total_internacoes - total_anterior) * 100.0
    / NULLIF(total_anterior, 0), 2) AS crescimento_percentual FROM crescimento_percentual WHERE total_anterior
    IS NOT NULL ORDER BY ano;
