- id: gt_gt216
  question: Qual a media movel de 3 anos da taxa de mortalidade no RS?
  category: agregacao_complexa
  difficulty: dificil
  tests: DT_INTER -> DT_SAIDA (convenção da base).
  gold_sql: WITH anual AS (SELECT year(i.DT_SAIDA) AS ano, COUNT(*) AS total_internacoes, SUM(CASE WHEN
    i."MORTE" = true THEN 1 ELSE 0 END) AS total_mortes FROM internacoes i LEFT JOIN municipios m ON i."MUNIC_RES"
