- id: gt_gt202
  question: Quais faixas etarias tiveram maior taxa de mortalidade em internacoes por COVID ou coronavirus,
    considerando apenas faixas com mais de 10000 internacoes?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'Tema: doencas especificas. Metrica: mortality_rate_by_age. Denominador/escopo: internacoes B342/B972
    por faixa etaria. Usa faixas etarias e filtro HAVING para evitar grupos pequenos.'
  gold_sql: WITH base AS (SELECT CASE WHEN "IDADE" < 40 THEN '00-39' WHEN "IDADE" BETWEEN 40 AND 49 THEN
    '40-49' WHEN "IDADE" BETWEEN 50 AND 59 THEN '50-59' WHEN "IDADE" BETWEEN 60 AND 69 THEN '60-69' WHEN
    "IDADE" BETWEEN 70 AND 79 THEN '70-79' ELSE '80+' END AS faixa_etaria, CASE WHEN "IDADE" < 40 THEN
    1 WHEN "IDADE" BETWEEN 40 AND 49 THEN 2 WHEN "IDADE" BETWEEN 50 AND 59 THEN 3 WHEN "IDADE" BETWEEN
    60 AND 69 THEN 4 WHEN "IDADE" BETWEEN 70 AND 79 THEN 5 ELSE 6 END AS ordem, "MORTE" FROM internacoes
    WHERE "DIAG_PRINC" IN ('B342', 'B972') AND "IDADE" IS NOT NULL) SELECT faixa_etaria, COUNT(*) AS total_internacoes,
    SUM(CASE WHEN "MORTE" = true THEN 1 ELSE 0 END) AS total_mortes, ROUND(SUM(CASE WHEN "MORTE" = true
    THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS taxa_mortalidade FROM base GROUP BY faixa_etaria,
    ordem HAVING COUNT(*) > 10000 ORDER BY taxa_mortalidade DESC;
