  question: Qual o custo medio por dia calendario de internacao por especialidade e desfecho de morte?
  category: join_dimensao
  difficulty: dificil
  ordered: true
  tests: 'Usa dias calendario calculados por DT_INTER/DT_SAIDA + 1 porque DIAS_PERM tem caveat de qualidade
    documentado. | Gold corrigido: removido LIMIT que a pergunta não pede'
  gold_sql: "SELECT e.\"DESCRICAO\" AS especialidade,\n       CASE WHEN i.\"MORTE\" = true THEN 'obito'\
    \ ELSE 'sem_obito' END AS desfecho,\n       COUNT(*) AS total_internacoes,\n       ROUND(AVG(i.\"\
    VAL_TOT\" / NULLIF(date_diff('day', i.\"DT_INTER\", i.\"DT_SAIDA\") + 1, 0)), 2) AS custo_medio_por_dia_calendario\n\
    FROM internacoes i\nJOIN especialidade e ON i.\"ESPEC\" = e.\"ESPEC\"\nWHERE i.\"VAL_TOT\" IS NOT\
    \ NULL\n  AND i.\"DT_INTER\" IS NOT NULL\n  AND i.\"DT_SAIDA\" IS NOT NULL\n  AND date_diff('day',\
    \ i.\"DT_INTER\", i.\"DT_SAIDA\") >= 0\nGROUP BY e.\"DESCRICAO\", desfecho\nHAVING COUNT(*) > 1000\n\
    ORDER BY custo_medio_por_dia_calendario DESC;"
  origem: GT230
- id: gt_gt231
  question: Qual percentual de internacoes possui diagnostico secundario preenchido por ano e por desfecho?
