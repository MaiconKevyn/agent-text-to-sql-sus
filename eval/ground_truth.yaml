- id: gt_gt234
  question: Quais capitulos CID concentram mais internacoes de alto custo acima do percentil 99 do valor
    total?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'Tema: custos. Metrica: high_cost_outliers. Denominador/escopo: internacoes acima do P99 de VAL_TOT.
    Calcula P99 de VAL_TOT e agrega internacoes de alto custo por capitulo CID. | Gold corrigido: removido
    LIMIT que a pergunta não pede; JOIN cid -> LEFT JOIN (cid tem códigos órfãos no fato)'
  gold_sql: WITH limite AS (SELECT QUANTILE_CONT("VAL_TOT", 0.99) AS p99_valor FROM internacoes WHERE
    "VAL_TOT" IS NOT NULL), alto_custo AS (SELECT i."DIAG_PRINC", i."VAL_TOT" FROM internacoes i, limite
    l WHERE i."VAL_TOT" > l.p99_valor) SELECT c."DS_CAPITULO" AS capitulo_cid, COUNT(*) AS internacoes_alto_custo,
    ROUND(SUM(a."VAL_TOT"), 2) AS custo_total_alto_custo FROM alto_custo a LEFT JOIN cid c ON a."DIAG_PRINC"
    = c."CID" GROUP BY c."DS_CAPITULO" ORDER BY internacoes_alto_custo DESC;
  origem: GT234
