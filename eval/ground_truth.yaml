- id: gt_gt225
  question: Qual a taxa de mortalidade por sexo e faixa etaria nas internacoes por COVID ou coronavirus?
  category: agregacao_complexa
  difficulty: dificil
  tests: 'Tema: doencas especificas. Metrica: mortality_cross_tab. Denominador/escopo: internacoes B342/B972
    por sexo e faixa. Calcula taxa por sexo e faixa etaria para B342/B972.'
  gold_sql: WITH base AS (SELECT s."DESCRICAO" AS sexo, CASE WHEN i."IDADE" < 40 THEN '00-39' WHEN i."IDADE"
    BETWEEN 40 AND 59 THEN '40-59' WHEN i."IDADE" BETWEEN 60 AND 79 THEN '60-79' ELSE '80+' END AS faixa_etaria,
    CASE WHEN i."IDADE" < 40 THEN 1 WHEN i."IDADE" BETWEEN 40 AND 59 THEN 2 WHEN i."IDADE" BETWEEN 60
    AND 79 THEN 3 ELSE 4 END AS ordem, i."MORTE" FROM internacoes i JOIN sexo s ON i."SEXO" = s."SEXO"
    WHERE i."DIAG_PRINC" IN ('B342', 'B972') AND i."IDADE" IS NOT NULL) SELECT sexo, faixa_etaria, COUNT(*)
    AS total_internacoes, SUM(CASE WHEN "MORTE" = true THEN 1 ELSE 0 END) AS total_mortes, ROUND(SUM(CASE
    WHEN "MORTE" = true THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS taxa_mortalidade FROM
    base GROUP BY sexo, faixa_etaria, ordem ORDER BY sexo, ordem;
  origem: GT225
