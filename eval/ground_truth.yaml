- id: gt_gt121
  question: Quais municípios com mais de 500 internações aparecem simultaneamente no top-20 de volume
    e no top-20 de taxa de mortalidade nos estados MA e RS?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'HARD: two CTEs each computing a different top-20 ranking, combined with IN subquery (intersection).
    Result: 2 municipalities — Bagé and São Leopoldo (RS cities that are both high-volume and high-mortality).
    | Gold corrigido: removido LIMIT que a pergunta não pede'
  gold_sql: "WITH top_volume AS (\n    SELECT mu.\"NO_MUNICIPIO\" AS nome\n    FROM internacoes i\n  \
    \  JOIN municipios mu ON i.\"MUNIC_RES\" = mu.\"CO_MUNICIPIO_6D\"\n    WHERE mu.\"SG_UF\" IN ('MA',\
    \ 'RS')\n    GROUP BY mu.\"NO_MUNICIPIO\"\n    HAVING COUNT(*) > 500\n    ORDER BY COUNT(*) DESC\n\
    \    LIMIT 20\n), top_mortalidade AS (\n    SELECT mu.\"NO_MUNICIPIO\" AS nome\n    FROM internacoes\
    \ i\n    JOIN municipios mu ON i.\"MUNIC_RES\" = mu.\"CO_MUNICIPIO_6D\"\n    WHERE mu.\"SG_UF\" IN\
    \ ('MA', 'RS')\n    GROUP BY mu.\"NO_MUNICIPIO\"\n    HAVING COUNT(*) > 500\n    ORDER BY SUM(CASE\
    \ WHEN i.\"MORTE\" = true THEN 1 ELSE 0 END) * 1.0 / COUNT(*) DESC\n    LIMIT 20\n)\nSELECT tv.nome\n\
    FROM top_volume tv\nWHERE tv.nome IN (SELECT nome FROM top_mortalidade)\nORDER BY tv.nome;"
  origem: GT121
