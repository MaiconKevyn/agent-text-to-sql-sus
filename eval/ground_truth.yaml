    i."MUNIC_RES" = mu."CO_MUNICIPIO_6D" GROUP BY mu."SG_UF", mu."NO_MUNICIPIO" HAVING COUNT(*) > 100
    ORDER BY taxa_mortalidade DESC LIMIT 10;
