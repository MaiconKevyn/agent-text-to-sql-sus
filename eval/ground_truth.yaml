- id: gt_gt130
  question: Quais são os 10 municípios com maior taxa de mortalidade em internações obstétricas, entre
    aqueles com mais de 200 internações obstétricas e taxa acima da média nacional obstétrica?
  category: agregacao_complexa
  difficulty: dificil
  ordered: true
  tests: 'HARD: CTE for national obstetric avg + cross-join + 2 HAVING conditions (volume + rate threshold)
    + ESPEC=2 filter. National obstetric mortality avg: ~0.0274%. Top: Lavras do Sul RS 0.8464%, Aceguá
    RS 0.6079%. Returns municipalities with 2–7 obstetric deaths but high rate due to small volume.'
  gold_sql: "WITH media_obs AS (\n    SELECT SUM(CASE WHEN i.\"MORTE\" = true THEN 1 ELSE 0 END) * 100.0\
    \ / COUNT(*) AS taxa_media_obstetrica\n    FROM internacoes i\n    WHERE i.\"ESPEC\" = 2\n)\nSELECT\
    \ mu.\"NO_MUNICIPIO\" AS nome,\n       mu.\"SG_UF\" AS estado,\n       COUNT(*) AS total_obstetrico,\n\
    \       SUM(CASE WHEN i.\"MORTE\" = true THEN 1 ELSE 0 END) AS total_mortes,\n       ROUND(SUM(CASE\
    \ WHEN i.\"MORTE\" = true THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 4) AS taxa_mort_obstetrica,\n   \
    \    ROUND(mo.taxa_media_obstetrica, 4) AS media_nacional\nFROM internacoes i\nJOIN municipios mu\
    \ ON i.\"MUNIC_RES\" = mu.\"CO_MUNICIPIO_6D\", media_obs mo\nWHERE i.\"ESPEC\" = 2\nGROUP BY mu.\"\
    NO_MUNICIPIO\", mu.\"SG_UF\", mo.taxa_media_obstetrica\nHAVING COUNT(*) > 200\n   AND SUM(CASE WHEN\
    \ i.\"MORTE\" = true THEN 1 ELSE 0 END) * 100.0 / COUNT(*) > mo.taxa_media_obstetrica\nORDER BY taxa_mort_obstetrica\
    \ DESC\nLIMIT 10;"
  origem: GT130
